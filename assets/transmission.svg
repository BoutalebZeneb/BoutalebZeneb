<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="Incoming holo-transmission from Zeneb: Hello there! I'm Zeneb, a Padawan at 1337: no teachers, no lectures, just peers, projects and the Force of curiosity. Piscine survived. Now I'm crossing the Common Core one planet at a time. Current sector: Hoth. Help me, Norminette. You're my only hope."><title>Incoming holo-transmission from Zeneb: Hello there! I'm Zeneb, a Padawan at 1337: no teachers, no lectures, just peers, projects and the Force of curiosity. Piscine survived. Now I'm crossing the Common Core one planet at a time. Current sector: Hoth. Help me, Norminette. You're my only hope.</title><style>@font-face{font-family:'HoloMono';src:url(data:font/woff2;base64,) format('woff2');}.m{font-family:'HoloMono';font-size:18px;fill:#A6F5FF}.hd{font-family:'HoloMono';font-size:15px;fill:#D8FCFF;letter-spacing:.5px}.dim{font-family:'HoloMono';font-size:13px;fill:#4FA9BC}.ln{clip-path:inset(-8px -8px -8px -4px);-webkit-clip-path:inset(-8px -8px -8px -4px)}@keyframes type{0%{clip-path:inset(-8px 100% -8px -4px);-webkit-clip-path:inset(-8px 100% -8px -4px)}}.holo{animation:flick 7s 5s infinite}@keyframes flick{0%,41%,44%,70%,72.5%,100%{opacity:1}42%{opacity:.5}43%{opacity:.9}71%{opacity:.7}}.dot{animation:blink 1.1s steps(2,jump-none) infinite}@keyframes blink{50%{opacity:.15}}.scan{animation:scan 5.5s linear infinite}@keyframes scan{0%{transform:translateY(-80px)}100%{transform:translateY(500px)}}.mer{transform-box:fill-box;transform-origin:center;animation:spin 9s linear infinite}@keyframes spin{0%{transform:scaleX(1)}25%{transform:scaleX(0)}50%{transform:scaleX(-1)}75%{transform:scaleX(0)}100%{transform:scaleX(1)}}.orb{animation:orb 6s linear infinite}@keyframes orb{to{transform:rotate(360deg)}}@keyframes show{0%{opacity:0}}.end{animation:fadein .6s both}@keyframes fadein{0%{opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#04202B"/><stop offset="1" stop-color="#020C12"/></linearGradient><pattern id="lines" width="4" height="3" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#8FEFFF" opacity=".05"/></pattern><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#2BB8D4" stroke-width=".5" opacity=".18"/></pattern><linearGradient id="cone" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#5FE6FF" stop-opacity=".38"/><stop offset=".7" stop-color="#5FE6FF" stop-opacity=".06"/><stop offset="1" stop-color="#5FE6FF" stop-opacity="0"/></linearGradient><linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7FF0FF" stop-opacity="0"/><stop offset=".5" stop-color="#7FF0FF" stop-opacity=".07"/><stop offset="1" stop-color="#7FF0FF" stop-opacity="0"/></linearGradient><radialGradient id="gl" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#5FE6FF" stop-opacity=".22"/><stop offset="1" stop-color="#5FE6FF" stop-opacity="0"/></radialGradient><filter id="tg" x="-5%" y="-30%" width="110%" height="160%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><clipPath id="card"><rect width="900" height="420" rx="20"/></clipPath></defs><g clip-path="url(#card)"><rect width="900" height="420" fill="url(#panel)"/><rect width="900" height="420" fill="url(#grid)"/><path d="M122 360 L214 360 L288 66 L48 66Z" fill="url(#cone)"/><circle cx="168" cy="176" r="130" fill="url(#gl)"/><g class="holo" filter="url(#tg)" fill="none" stroke="#7FEFFF"><circle cx="168" cy="176" r="80" stroke-width="1.6"/><ellipse cx="168" cy="245.3" rx="40" ry="7.2" stroke-width=".9" opacity=".55"/><ellipse cx="168" cy="221.9" rx="65.5" ry="11.8" stroke-width=".9" opacity=".55"/><ellipse cx="168" cy="192.6" rx="78.3" ry="14.1" stroke-width=".9" opacity=".55"/><ellipse cx="168" cy="159.4" rx="78.3" ry="14.1" stroke-width=".9" opacity=".55"/><ellipse cx="168" cy="130.1" rx="65.5" ry="11.8" stroke-width=".9" opacity=".55"/><ellipse cx="168" cy="106.7" rx="40" ry="7.2" stroke-width=".9" opacity=".55"/><ellipse class="mer" cx="168" cy="176" rx="80" ry="80" stroke-width=".9" opacity=".6" style="animation-delay:-0.0s"/><ellipse class="mer" cx="168" cy="176" rx="80" ry="80" stroke-width=".9" opacity=".6" style="animation-delay:-1.5s"/><ellipse class="mer" cx="168" cy="176" rx="80" ry="80" stroke-width=".9" opacity=".6" style="animation-delay:-3.0s"/><ellipse class="mer" cx="168" cy="176" rx="80" ry="80" stroke-width=".9" opacity=".6" style="animation-delay:-4.5s"/><ellipse class="mer" cx="168" cy="176" rx="80" ry="80" stroke-width=".9" opacity=".6" style="animation-delay:-6.0s"/><ellipse class="mer" cx="168" cy="176" rx="80" ry="80" stroke-width=".9" opacity=".6" style="animation-delay:-7.5s"/><g transform="translate(168 176) rotate(-16) scale(1 .3)"><circle r="106" stroke-width="2.4" opacity=".5"/><g class="orb"><circle cx="106" cy="0" r="6" fill="#DFFCFF" stroke="none"/></g></g></g><ellipse cx="168" cy="364" rx="62" ry="13" fill="#0B2C37" stroke="#2C8FA6" stroke-width="1.2"/><ellipse cx="168" cy="360" rx="46" ry="9" fill="#5FE6FF" opacity=".35" filter="url(#tg)"/><ellipse cx="168" cy="360" rx="22" ry="4" fill="#DFFCFF" opacity=".8"/><text class="dim" x="168" y="402" text-anchor="middle">Origin: 1337, Morocco</text><circle class="dot" cx="336" cy="52" r="5" fill="#FF4D5E"/><text class="hd" x="350" y="57">Incoming transmission from 1337</text><path d="M330 74H864" stroke="#2BB8D4" stroke-opacity=".35" stroke-width="1"/><g class="holo" filter="url(#tg)"><text class="m ln" x="330" y="116" style="animation:type 0.30s steps(12,end) 4.40s both">Hello there!</text><text class="m ln" x="330" y="158" style="animation:type 1.12s steps(45,end) 5.33s both">I&#39;m Zeneb, a Padawan at 1337: no teachers, no</text><text class="m ln" x="330" y="186" style="animation:type 1.10s steps(44,end) 6.64s both">lectures, just peers, projects and the Force</text><text class="m ln" x="330" y="214" style="animation:type 0.33s steps(13,end) 7.92s both">of curiosity.</text><text class="m ln" x="330" y="256" style="animation:type 1.12s steps(45,end) 8.87s both">Piscine survived. Now I&#39;m crossing the Common</text><text class="m ln" x="330" y="284" style="animation:type 1.20s steps(48,end) 10.18s both">Core one planet at a time. Current sector: Hoth.</text><text class="m ln" x="330" y="326" style="animation:type 1.02s steps(41,end) 12.00s both">Help me, Norminette. You&#39;re my only hope.</text><rect class="cur" x="734.5" y="311" width="10" height="18" fill="#A6F5FF" style="animation:show .01s 13.21s both,blink 1s 13.21s steps(2,jump-none) infinite"/></g><text class="dim end" x="330" y="376" style="animation-delay:13.51s">End of message.</text><rect width="900" height="420" fill="url(#lines)"/><rect class="scan" y="0" width="900" height="80" fill="url(#bar)"/></g><rect x=".5" y=".5" width="899" height="419" rx="20" fill="none" stroke="#1B5F70" stroke-width="1"/></svg>